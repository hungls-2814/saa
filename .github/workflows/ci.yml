name: CI

# Pull-request quality gates — lint, typecheck, tests — plus a gated Vercel
# Preview deploy. Runs on every pull request targeting main.
#
# The `preview` job is gated behind `test` (needs: test), so a preview is built
# only after lint/typecheck/test pass — never for broken code. Push to main
# (i.e. a merge) is handled by cd.yml, which re-runs the gates before deploying
# production, so main is validated once, on the merged commit.
#
# Preview deploy requires the same repo secrets as CD: VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID. See docs/setup/vercel-deployment.md.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  preview:
    name: Deploy Preview (Vercel)
    # Gated: only after the quality gates pass. This workflow is PR-only, so no
    # event guard is needed.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the preview URL as a PR comment
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🔎 Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n### 🔎 Vercel Preview\n${url}\n\n_Updated for commit ${context.sha.slice(0, 7)}._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
